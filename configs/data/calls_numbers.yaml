# Number-heavy Deepgram call rows, mixed into calls_deepgram_raw.yaml's data
# (calls-v1's files) in the same label style: Deepgram only, hi only, numbers
# as written, and only rows that hold a number (bolai.RowFilter.numbers_only).
# Plan it without calls-v1's files, so no row is in both:
#   plan --config configs/data/calls_numbers.yaml --exclude-files-from /data-g/uday/calls/plan.json
#
# split_seed is calls-v1, as in every calls config, so customers held out there
# stay out of training here, and this val/test are number rows from those customers.

dataset: kapturecx/bolAIndia
revision: 3e812ecb20f11e074f5d7116a44e752b373cde5e

# inhouse-asr-1 is AssemblyAI; inhouse-asr-2's few files are all in calls-v1.
subsets: {combined: 1.0}
heldout_subsets: [combined]
vendor: deepgram_nova-3          # plan: only files holding Deepgram rows (the stats' vendor key)
# max_hours counts all vendors' hours in those files. The whole pool is 1,592
# files, 6,843 h, 387 GB; a 3-file trial kept ~3.8% of planned hours as number
# rows (13% of usable Deepgram rows hold a number). 3400 = about half: ~800 files,
# ~195 GB, ~130 h of number rows. Raise it and rerun plan + convert on the same --out to grow.
max_hours: 3400
plan_seed: numbers-v1

# Rows
providers: [deepgram]
languages: [hi]
min_duration: 0.1
max_duration: 20.0
min_confidence: {deepgram: 0.60} # numbers are what this data teaches: skip Deepgram's least sure rows
channels: null
target_style: as_written         # numbers as Deepgram wrote them
numbers_only: true

# Splits
val_frac: 0.01
test_frac: 0.01
split_seed: calls-v1
val_small_hours: 3.0
test_clients: []
