# Number-heavy call rows, mixed into calls_deepgram_raw.yaml's data: every
# vendor, calls_spoken.yaml's confidence gates, only the call subsets and only
# rows that hold a number (bolai.RowFilter.numbers_only).
#
# plan_seed differs from the other configs', so mostly other files come first.
# split_seed is calls-v1, as in every calls config, so customers held out there
# stay out of training here, and this val/test are number rows from those customers.
# max_hours is planned before the number filter: run convert with
# --limit-files 3 and compare report.json's dropped.no_number to the kept rows.

dataset: kapturecx/bolAIndia
revision: 3e812ecb20f11e074f5d7116a44e752b373cde5e

subsets:
  combined: 0.97
  inhouse-asr-1: 0.03
heldout_subsets: [combined, inhouse-asr-1]
max_hours: 2000
plan_seed: numbers-v1

# Rows
providers: null
languages: [hi, en]
min_duration: 0.1
max_duration: 20.0
min_confidence:
  assemblyai: 0.65
  deepgram: 0.60
channels: null
target_style: as_written         # numbers as each vendor wrote them, like calls_deepgram_raw.yaml it is mixed with
numbers_only: true

# Splits
val_frac: 0.01
test_frac: 0.01
split_seed: calls-v1
val_small_hours: 3.0
test_clients: []
