# Smoke run: the first ~40 planned hours of the smoke shares (same seed),
# about 10 files: calls plus one public file. Bigger
# held-out fractions than calls_mix.yaml so val and test are not near-empty.
# Everything else matches the real run.

dataset: kapturecx/bolAIndia
revision: 3e812ecb20f11e074f5d7116a44e752b373cde5e

subsets:
  combined: 0.66
  inhouse-asr-1: 0.02
  inhouse-asr-2: 0.01
  indicvoices: 0.08
  spring-inx: 0.05
  vaani: 0.05
  shrutilipi: 0.05
  pretraining-v1-kathbath: 0.03
  nptel: 0.05
heldout_subsets: [combined, inhouse-asr-1, inhouse-asr-2]
max_hours: 40
plan_seed: mix-v1

providers: null
languages: [hi, en]
min_duration: 0.1
max_duration: 20.0
min_confidence: 0.0
channels: null

val_frac: 0.05
test_frac: 0.05
split_seed: calls-v1
val_small_hours: 0.25
# Whole clients held out of every other split (client_test_manifest.jsonl):
# val/test share agents and clients with train, this does not. Choose from
# report.json's splits.train.top_clients after a trial run; [] = none.
test_clients: []
